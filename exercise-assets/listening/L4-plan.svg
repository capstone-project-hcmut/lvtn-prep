<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="Helvetica,Arial,sans-serif">
<rect width="1000" height="720" fill="#fff"/>
<text x="500" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">Study Hub: ground floor (proposed)</text>
<g transform="translate(950,50)"><line x1="0" y1="22" x2="0" y2="-8" stroke="#333" stroke-width="2"/><path d="M-7,0 L0,-14 L7,0 Z" fill="#333"/><text x="0" y="-18" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">N</text></g>
<!-- room -->
<rect x="80" y="100" width="840" height="540" fill="#fafafa" stroke="none"/>
<g stroke="#222" stroke-width="6" fill="none">
  <line x1="80" y1="100" x2="920" y2="100"/>
  <line x1="80" y1="100" x2="80" y2="640"/>
  <line x1="920" y1="100" x2="920" y2="330"/><line x1="920" y1="410" x2="920" y2="640"/>
  <line x1="80" y1="640" x2="455" y2="640"/><line x1="545" y1="640" x2="920" y2="640"/>
</g>
<!-- windows on north wall -->
<g stroke="#6f9fc6" stroke-width="6">
  <line x1="120" y1="100" x2="300" y2="100"/><line x1="410" y1="100" x2="590" y2="100"/><line x1="700" y1="100" x2="880" y2="100"/>
</g>
<text x="500" y="88" text-anchor="middle" font-size="12" fill="#3d6a91">windows</text>
<!-- stairs -->
<rect x="83" y="300" width="80" height="130" fill="#e3e3e3" stroke="#555" stroke-width="1.2"/>
<g stroke="#888" stroke-width="1.2"><line x1="83" y1="316" x2="163" y2="316"/><line x1="83" y1="332" x2="163" y2="332"/><line x1="83" y1="348" x2="163" y2="348"/><line x1="83" y1="364" x2="163" y2="364"/><line x1="83" y1="380" x2="163" y2="380"/><line x1="83" y1="396" x2="163" y2="396"/><line x1="83" y1="412" x2="163" y2="412"/></g>
<text x="123" y="450" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">STAIRS</text>
<!-- east door -->
<text x="930" y="360" font-size="12" fill="#333">To lecture</text>
<text x="930" y="376" font-size="12" fill="#333">theatres →</text>
<!-- entrance -->
<text x="500" y="668" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">ENTRANCE</text>
<path d="M500,700 L500,676" stroke="#333" stroke-width="2"/><path d="M493,684 L500,672 L507,684 Z" fill="#333" transform="rotate(0)"/>
<!-- letters -->
<g font-size="17" font-weight="bold" text-anchor="middle" fill="#111">
  <circle cx="250" cy="560" r="17" fill="#fff" stroke="#111" stroke-width="2"/><text x="250" y="566">A</text>
  <circle cx="750" cy="560" r="17" fill="#fff" stroke="#111" stroke-width="2"/><text x="750" y="566">B</text>
  <circle cx="240" cy="365" r="17" fill="#fff" stroke="#111" stroke-width="2"/><text x="240" y="371">C</text>
  <circle cx="500" cy="365" r="17" fill="#fff" stroke="#111" stroke-width="2"/><text x="500" y="371">D</text>
  <circle cx="200" cy="175" r="17" fill="#fff" stroke="#111" stroke-width="2"/><text x="200" y="181">E</text>
  <circle cx="800" cy="175" r="17" fill="#fff" stroke="#111" stroke-width="2"/><text x="800" y="181">F</text>
  <circle cx="840" cy="370" r="17" fill="#fff" stroke="#111" stroke-width="2"/><text x="840" y="376">G</text>
